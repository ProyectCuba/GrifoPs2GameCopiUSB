    <rect x="644" y="232" width="190" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="739" y="258" text-anchor="middle">USBExtreme</text>
    <rect x="850" y="232" width="230" height="40" rx="20" fill="#fff" fill-opacity=".08"/><text x="965" y="258" text-anchor="middle">Juegos de +4 GB</text>
