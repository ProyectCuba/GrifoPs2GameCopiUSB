    <path d="M130 140 l22 22 m-9 -2 l9 2 l-2 -9" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="152" y="148" width="50" height="14" rx="3" fill="#94A3BE"/>
    <rect x="144" y="160" width="66" height="50" rx="12" fill="url(#ic)"/>
